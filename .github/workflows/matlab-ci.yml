name: PNAS2017 evidence integrity
on:
  push:
    branches: ["**"]
  workflow_dispatch:
jobs:
  pnas-integrity:
    # Frozen eigenvalue certificates are qualified on the original Windows/MKL build.
    runs-on: windows-2022
    env:
      MKL_ENABLE_INSTRUCTIONS: AVX2
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: pnas-evidence
          environment-file: .github/environments/pnas2017-windows-mkl-explicit.conda.lock
          auto-update-conda: false
      - name: Install the existing symbolic verifier overlay
        run: python -m pip install sympy==1.13.1
      - name: Record the qualified numerical runtime
        run: |
          Get-CimInstance Win32_Processor | Select-Object Name,Manufacturer,NumberOfCores,NumberOfLogicalProcessors
          python -c "import sys,numpy,scipy; print(sys.version); print(numpy.__version__,scipy.__version__); numpy.show_config()"
      - name: Verify current PNAS authority and preserved evidence
        run: python -B scripts/run_pnas2017_preflight.py --report-dir "${{ runner.temp }}/pnas-preflight"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pnas-integrity-reports
          path: ${{ runner.temp }}/pnas-preflight/
