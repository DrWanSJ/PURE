name: PNAS2017 evidence integrity
on:
  push:
    branches: ["**"]
  workflow_dispatch:
jobs:
  pnas-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing evidence verifier dependencies
        run: python -m pip install numpy==1.26.4 scipy==1.13.1 sympy==1.13.1
      - name: Verify current PNAS authority and preserved evidence
        run: python -B scripts/run_pnas2017_preflight.py --report-dir "${{ runner.temp }}/pnas-preflight"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pnas-integrity-reports
          path: ${{ runner.temp }}/pnas-preflight/
