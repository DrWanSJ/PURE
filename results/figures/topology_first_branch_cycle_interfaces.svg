    <text style="fill: #162c47; font: 10.1px 'DejaVu Sans Mono'; text-anchor: start" x="72" y="486.513344" transform="rotate(-0 72 486.513344)">H  elRS70SAGGU0002_fMet_EFTu_GDP_PO4_GlytRNAGlyGCC</text>
   </g>
   <g id="text_18">
    <text style="fill: #162c47; font: 11px 'DejaVu Sans'; text-anchor: start" x="72" y="511.355312" transform="rotate(-0 72 511.355312)">Author coefficients for reactions 13, 14, 21:  140, 260, 0.23  (all positive)</text>
   </g>
   <g id="text_19">
    <text style="fill: #56677d; font: 10.1px 'DejaVu Sans'; text-anchor: start" x="72" y="542.066969" transform="rotate(-0 72 542.066969)">Positive support does not certify instantaneous flux.  H retains bound PO4 until the later release step.</text>
   </g>
   <g id="text_20">
    <text style="fill: #008d8b; font: 700 10.6px 'DejaVu Sans'; text-anchor: start" x="743.04" y="149.084938" transform="rotate(-0 743.04 149.084938)">SHARED HUBS REQUIRE RESOURCE LEDGERS</text>
   </g>
