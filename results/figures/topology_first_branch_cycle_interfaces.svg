   <g id="text_11">
    <text style="fill: #c07a21; font: 10.8px 'DejaVu Sans'; text-anchor: middle" x="266.4" y="316.180125" transform="rotate(-0 266.4 316.180125)">exact reverse of docking</text>
   </g>
   <g id="text_12">
    <text style="fill: #56677d; font: 10.1px 'DejaVu Sans'; text-anchor: start" x="70.56" y="337.586969" transform="rotate(-0 70.56 337.586969)">13 + 21 has zero net ledger.  Two author-nonzero exits from D; no flux split or equilibrium is inferred.</text>
   </g>
   <g id="text_13">
    <text style="fill: #56677d; font: 700 10.5px 'DejaVu Sans'; text-anchor: start" x="70.56" y="403.217344" transform="rotate(-0 70.56 403.217344)">EXACT SPECIES ALIAS KEY</text>
   </g>
   <g id="text_14">
    <text style="fill: #162c47; font: 10.1px 'DejaVu Sans Mono'; text-anchor: start" x="72" y="428.193344" transform="rotate(-0 72 428.193344)">A  elRS70SAGGU0002_fMet</text>
   </g>
   <g id="text_15">
    <text style="fill: #162c47; font: 10.1px 'DejaVu Sans Mono'; text-anchor: start" x="72" y="447.633344" transform="rotate(-0 72 447.633344)">T  EFTu_GTP_GlytRNAGlyGCC</text>
   </g>
   <g id="text_16">
    <text style="fill: #162c47; font: 10.1px 'DejaVu Sans Mono'; text-anchor: start" x="72" y="467.073344" transform="rotate(-0 72 467.073344)">D  elRS70SAGGU0002_fMet_EFTu_GTP_GlytRNAGlyGCC</text>
