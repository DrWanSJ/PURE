   <g id="text_38">
    <text style="fill: #56677d; font: 9.7px 'DejaVu Sans'" transform="translate(743.04 525.782311)">Interfaces restored above; zero nonhub interfaces in this view.</text>
    <text style="fill: #56677d; font: 9.7px 'DejaVu Sans'" transform="translate(743.04 537.970876)">Localized topology does not imply dynamical independence.</text>
   </g>
   <g id="text_39">
    <text style="fill: #56677d; font: 11.5px 'DejaVu Sans'; text-anchor: start" x="46.8" y="588.533281" transform="rotate(-0 46.8 588.533281)">Preserve branch competition and shared-resource coupling when designing a structural or local-QSSA closure.</text>
   </g>
