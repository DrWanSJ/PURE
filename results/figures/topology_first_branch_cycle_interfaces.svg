   </g>
   <g id="text_27">
    <text style="fill: #56677d; font: 10.5px 'DejaVu Sans'" transform="translate(743.04 272.78044)">Full-graph incidences; shared across source modules.</text>
    <text style="fill: #56677d; font: 10.5px 'DejaVu Sans'" transform="translate(743.04 285.974248)">Topology does not establish eliminability or fastness.</text>
   </g>
   <g id="text_28">
