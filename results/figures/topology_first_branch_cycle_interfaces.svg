   <g id="text_1">
    <text style="fill: #162c47; font: 700 27px 'DejaVu Sans'; text-anchor: start" x="46.8" y="44.890312" transform="rotate(-0 46.8 44.890312)">Branches, returns and open subnetworks matter</text>
   </g>
   <g id="text_2">
    <text style="fill: #56677d; font: 13.5px 'DejaVu Sans'; text-anchor: start" x="46.8" y="77.165156" transform="rotate(-0 46.8 77.165156)">Actual first-Gly docking branch, an exact reverse pair, and measured shared-resource interfaces</text>
   </g>
   <g id="text_3">
    <text style="fill: #56677d; font: 700 10.8px 'DejaVu Sans'; text-anchor: start" x="70.56" y="149.140125" transform="rotate(-0 70.56 149.140125)">AUTHOR-NONZERO BRANCH + BINDING / UNBINDING RETURN</text>
   </g>
   <g id="text_4">
    <text style="fill: #162c47; font: 18px 'DejaVu Sans'; text-anchor: middle" x="144" y="217.366875" transform="rotate(-0 144 217.366875)">A + T</text>
