   <g id="text_1">
    <text style="fill: #162c47; font: 700 27px 'DejaVu Sans'; text-anchor: start" x="46.8" y="44.784844" transform="rotate(-0 46.8 44.784844)">Topology first, QSSA second</text>
   </g>
   <g id="text_2">
    <text style="fill: #56677d; font: 13.5px 'DejaVu Sans'; text-anchor: start" x="46.8" y="77.165156" transform="rotate(-0 46.8 77.165156)">A proposed order of operations for the detailed PNAS 2017 translation network</text>
   </g>
   <g id="text_3">
    <text style="fill: #336ba5; font: 700 11px 'DejaVu Sans'; text-anchor: middle" x="81.72" y="172.955312" transform="rotate(-0 81.72 172.955312)">01</text>
   </g>
   <g id="text_4">
    <text style="fill: #162c47; font: 700 16.5px 'DejaVu Sans'; text-anchor: start" x="106.56" y="174.472969" transform="rotate(-0 106.56 174.472969)">Detailed SBML model</text>
   </g>
   <g id="text_5">
    <text style="fill: #56677d; font: 13px 'DejaVu Sans'" transform="translate(66.24 226.291997)">Freeze source provenance</text>
    <text style="fill: #56677d; font: 13px 'DejaVu Sans'" transform="translate(66.24 242.627187)">Keep species and reaction roles</text>
    <text style="fill: #56677d; font: 13px 'DejaVu Sans'" transform="translate(66.24 258.962378)">Record default activity</text>
   </g>
   <g id="text_6">
    <text style="fill: #336ba5; font: 700 11px 'DejaVu Sans'; text-anchor: middle" x="448.92" y="172.955312" transform="rotate(-0 448.92 172.955312)">02</text>
   </g>
   <g id="text_7">
    <text style="fill: #162c47; font: 700 16.5px 'DejaVu Sans'; text-anchor: start" x="473.76" y="174.408516" transform="rotate(-0 473.76 174.408516)">Topology analysis</text>
   </g>
   <g id="text_8">
    <text style="fill: #56677d; font: 13px 'DejaVu Sans'" transform="translate(433.44 226.291997)">Chains · branches · cycles</text>
    <text style="fill: #56677d; font: 13px 'DejaVu Sans'" transform="translate(433.44 242.627187)">Shared hubs and interfaces</text>
    <text style="fill: #56677d; font: 13px 'DejaVu Sans'" transform="translate(433.44 258.962378)">Full graph + author-CSV support graph</text>
   </g>
   <g id="text_9">
    <text style="fill: #336ba5; font: 700 11px 'DejaVu Sans'; text-anchor: middle" x="816.12" y="172.955312" transform="rotate(-0 816.12 172.955312)">03</text>
   </g>
   <g id="text_10">
    <text style="fill: #162c47; font: 700 16.5px 'DejaVu Sans'; text-anchor: start" x="840.96" y="174.472969" transform="rotate(-0 840.96 174.472969)">Motif detection</text>
   </g>
   <g id="text_11">
    <text style="fill: #56677d; font: 13px 'DejaVu Sans'" transform="translate(800.64 226.291997)">Find real internal paths</text>
    <text style="fill: #56677d; font: 13px 'DejaVu Sans'" transform="translate(800.64 242.627187)">Check side branches and storage</text>
    <text style="fill: #56677d; font: 13px 'DejaVu Sans'" transform="translate(800.64 258.962378)">Rank structural candidates</text>
   </g>
   <g id="text_12">
    <text style="fill: #c07a21; font: 700 11px 'DejaVu Sans'; text-anchor: middle" x="816.12" y="407.675313" transform="rotate(-0 816.12 407.675313)">04</text>
   </g>
   <g id="text_13">
    <text style="fill: #162c47; font: 700 16.5px 'DejaVu Sans'; text-anchor: start" x="840.96" y="409.128516" transform="rotate(-0 840.96 409.128516)">Structural lumping</text>
   </g>
   <g id="text_14">
    <text style="fill: #56677d; font: 13px 'DejaVu Sans'" transform="translate(800.64 461.011997)">Effective step or aggregate E</text>
    <text style="fill: #56677d; font: 13px 'DejaVu Sans'" transform="translate(800.64 477.347188)">State assumptions and lost detail</text>
    <text style="fill: #56677d; font: 13px 'DejaVu Sans'" transform="translate(800.64 493.682378)">Human review before adoption</text>
   </g>
   <g id="text_15">
    <text style="fill: #008d8b; font: 700 11px 'DejaVu Sans'; text-anchor: middle" x="448.92" y="407.675313" transform="rotate(-0 448.92 407.675313)">05</text>
   </g>
   <g id="text_16">
    <text style="fill: #162c47; font: 700 16.5px 'DejaVu Sans'; text-anchor: start" x="473.76" y="409.192969" transform="rotate(-0 473.76 409.192969)">Local QSSA</text>
   </g>
   <g id="text_17">
    <text style="fill: #56677d; font: 13px 'DejaVu Sans'" transform="translate(433.44 461.011997)">Test local timescale separation</text>
    <text style="fill: #56677d; font: 13px 'DejaVu Sans'" transform="translate(433.44 477.347188)">Retain resource-dependent coupling</text>
    <text style="fill: #56677d; font: 13px 'DejaVu Sans'" transform="translate(433.44 493.682378)">Respect the revised topology</text>
   </g>
   <g id="text_18">
    <text style="fill: #008d8b; font: 700 11px 'DejaVu Sans'; text-anchor: middle" x="81.72" y="407.675313" transform="rotate(-0 81.72 407.675313)">06</text>
   </g>
   <g id="text_19">
    <text style="fill: #162c47; font: 700 15px 'DejaVu Sans'; text-anchor: start" x="106.56" y="408.779063" transform="rotate(-0 106.56 408.779063)">Reduced model validation</text>
   </g>
   <g id="text_20">
    <text style="fill: #56677d; font: 13px 'DejaVu Sans'" transform="translate(66.24 461.011997)">Protein + resource trajectories</text>
    <text style="fill: #56677d; font: 13px 'DejaVu Sans'" transform="translate(66.24 477.347188)">Conservation and flux accounting</text>
    <text style="fill: #56677d; font: 13px 'DejaVu Sans'" transform="translate(66.24 493.682378)">Document startup mismatch</text>
   </g>
   <g id="text_21">
    <text style="fill: #336ba5; font: 700 11px 'DejaVu Sans'; text-anchor: middle" x="306.72" y="324.155312" transform="rotate(-0 306.72 324.155312)">TOPOLOGY + CHEMISTRY BEFORE ELIMINATION</text>
   </g>
   <g id="text_22">
    <text style="fill: #56677d; font: 12px 'DejaVu Sans'; text-anchor: start" x="46.8" y="354.67125" transform="rotate(-0 46.8 354.67125)">Existing QSSA evidence remains useful as bounded input.</text>
   </g>
   <g id="text_23">
    <text style="fill: #162c47; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="46.8" y="371.904375" transform="rotate(-0 46.8 371.904375)">A fast variable is not, by itself, a removable variable.</text>
   </g>
   <g id="text_24">
    <text style="fill: #56677d; font: 11.5px 'DejaVu Sans'; text-anchor: start" x="46.8" y="577.573359" transform="rotate(-0 46.8 577.573359)">Each proposed closure is HUMAN_REVIEW_REQUIRED.  Passing engineering checks does not approve a reduced model.</text>
   </g>
   <g id="text_25">
    <text style="fill: #56677d; font: 9px 'DejaVu Sans'; text-anchor: start" x="46.8" y="624.563437" transform="rotate(-0 46.8 624.563437)">Workflow proposal; validation remains a separate scientific gate</text>
   </g>
   <g id="text_26">
    <text style="fill: #c07a21; font: 700 9px 'DejaVu Sans'; text-anchor: end" x="1105.2" y="624.457969" transform="rotate(-0 1105.2 624.457969)">FIGURE 3  |  HUMAN_REVIEW_REQUIRED</text>
   </g>
